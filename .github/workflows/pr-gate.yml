name: PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    # Without this, the changelog job's own commit below would re-trigger this
    # workflow on every push — an infinite loop.
    paths-ignore:
      - CHANGELOG.md

# Least privilege. `pull-requests: write` is what lets the run upsert its summary
# comment on the PR; drop it and the checks still run, they just report to the log.
permissions:
  contents: read
  pull-requests: write

# Push three times in a minute and the first two runs become answers to questions
# nobody is asking any more — they still hold a runner, and they still race to
# upsert the summary comment, so a stale verdict can land on top of a fresh one.
# Keyed per PR (or per branch, for pushes), so unrelated runs never cancel each other.
concurrency:
  group: pr-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs the actual test suite plus a real end-to-end install on both platforms
  # this package ships a binary path for. Windows was previously never exercised
  # in CI at all — the zip/unzipper extraction path and the resulting .exe only
  # ever ran on a maintainer's machine, if that.
  test:
    name: Test (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

      # Not a unit test: this actually downloads the real Gitleaks release for
      # the runner's OS/arch and executes it. On Windows that means the
      # unzipper-based extraction path and the resulting gitleaks.exe — the one
      # part of this package that unit tests alone can never cover, because it
      # depends on the platform's own archive format and executable loader.
      - name: Smoke test real binary install
        run: node dist/bin/cli.js --engine-version

  # Runs on every PR into main. This is the gate: branch protection requires it,
  # so nothing reaches main without passing these checks first.
  checks:
    name: PR CheckMate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A hung step otherwise runs to GitHub's six-hour default before anyone hears
    # about it. Every check here has its own internal timeout; this is the backstop
    # for the ones that cannot fail themselves — a wedged network fetch, a tool
    # waiting on stdin. Raise it for a large monorepo.
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Required, not optional. Without the full history the PR base commit is
          # not in the clone, no diff range can be built, and every diff-based
          # check — Diff Security, Workflow Security, Dockerfile Security,
          # Sensitive Files and a dozen others — skips itself. The run then says
          # `Scan Scope: … set fetch-depth: 0`, which is this line.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # PR CheckMate fetches only the tooling this repository turns out to need
      # (`npx pr-checkmate doctor` prints what and why). Without this step that
      # tooling is fetched again on every run: the download shrinks, the wait
      # does not. The key carries the pr-checkmate version, so an upgrade fetches
      # afresh instead of reusing tooling meant for the previous one.
      - name: Cache PR CheckMate tooling
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pr-checkmate
          key: pr-checkmate-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            pr-checkmate-${{ runner.os }}-

      # Grype keeps its own vulnerability database, and it is the single largest
      # download in the whole run: 134 MB compressed, 1.9 GB unpacked, refreshed
      # daily upstream. Without this step every job pays for it again. The key is
      # dated rather than content-hashed, because the thing that changes is the
      # upstream database, not anything in this repository — a stale entry is
      # restored by the prefix and grype updates it in place.
      - name: Cache Grype vulnerability database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/grype
          key: grype-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            grype-db-${{ runner.os }}-

      # One job runs the whole registry. Splitting it per check would repeat the
      # checkout and install for every one of them, and the selection of what runs
      # belongs in pr-checkmate.json (`severity`), not in copied YAML.
      #
      # This template is the one `init` scaffolds when pr-checkmate IS a
      # dependency: `npm ci` above installs it, so npx runs that copy at the
      # version your lockfile pins. A repository that does not install it gets
      # the container variant instead, because bare `npx` would resolve to the
      # newest release and download it on every job.
      - name: Run PR CheckMate
        env:
          # Not injected automatically: without this the run cannot authenticate,
          # and the summary comment silently never reaches the PR.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx pr-checkmate all

  # Runs only after a merge lands on main — which, with branch protection on the
  # `checks` job above, only happens once PR CheckMate has already passed. So this
  # never regenerates the changelog for code that failed the gate.
  changelog:
    name: Update Changelog
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate changelog
        run: npm run changelog

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- CHANGELOG.md; then
            echo "No changelog changes."
          else
            git add CHANGELOG.md
            git commit -m "docs(changelog): update CHANGELOG.md [skip ci]"
            git push origin HEAD:main
          fi
