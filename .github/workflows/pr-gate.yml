name: PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    # Without this, the changelog job's own commit below would re-trigger this
    # workflow on every push — an infinite loop.
    paths-ignore:
      - CHANGELOG.md

# Least privilege. `pull-requests: write` is what lets the run upsert its summary
# comment on the PR; drop it and the checks still run, they just report to the log.
permissions:
  contents: read
  pull-requests: write

# Push three times in a minute and the first two runs become answers to questions
# nobody is asking any more — they still hold a runner, and they still race to
# upsert the summary comment, so a stale verdict can land on top of a fresh one.
# Keyed per PR (or per branch, for pushes), so unrelated runs never cancel each other.
concurrency:
  group: pr-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs the actual test suite plus a real end-to-end install on both platforms
  # this package ships a binary path for. Windows was previously never exercised
  # in CI at all — the zip/unzipper extraction path and the resulting .exe only
  # ever ran on a maintainer's machine, if that.
  test:
    name: Test (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

      # Not a unit test: this actually downloads the real Gitleaks release for
      # the runner's OS/arch and executes it. On Windows that means the
      # unzipper-based extraction path and the resulting gitleaks.exe — the one
      # part of this package that unit tests alone can never cover, because it
      # depends on the platform's own archive format and executable loader.
      - name: Smoke test real binary install
        run: node dist/bin/cli.js --engine-version

  # Runs on every PR into main. This is the gate: branch protection requires it,
  # so nothing reaches main without passing these checks first.
  #
  # Container variant, deliberately: this repo does not carry pr-checkmate as a
  # dependency (it was a devDependency briefly, but that pulled ~530 transitive
  # packages into every npm ci/audit/lockfile just to run a gate that doesn't
  # need to live in this repo's own dependency tree). The alternative, bare
  # `npx pr-checkmate`, would resolve to whatever is newest on the registry and
  # download it fresh on every job — and a major release of the gate could
  # start failing builds that passed yesterday, with no line changed here to
  # explain why. The image tag below pins the major so nothing moves under us.
  checks:
    name: PR CheckMate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A hung step otherwise runs to GitHub's six-hour default before anyone hears
    # about it. Every check here has its own internal timeout; this is the backstop
    # for the ones that cannot fail themselves — a wedged network fetch, a tool
    # waiting on stdin. Raise it for a large monorepo.
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Required, not optional. Without the full history the PR base commit is
          # not in the clone, no diff range can be built, and every diff-based
          # check — Diff Security, Workflow Security, Dockerfile Security,
          # Sensitive Files and a dozen others — skips itself. The run then says
          # `Scan Scope: … set fetch-depth: 0`, which is this line.
          fetch-depth: 0

      # One job runs the whole registry. Which checks run is decided in
      # pr-checkmate.json (`severity`), not by splitting this into jobs.
      #
      # `--user` is not a detail: without it every file a formatter rewrites
      # comes back owned by root, and the next step in the pipeline fails on
      # permissions long after this one reported success.
      #
      # The environment variables are passed through by name rather than by
      # value: the run reads them to find the PR, and interpolating them into
      # the command line would put their contents through a shell.
      - name: Run PR CheckMate
        env:
          # Not injected automatically: without this the run cannot authenticate,
          # and the summary comment silently never reaches the PR.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            --user "$(id -u):$(id -g)" \
            -e GITHUB_TOKEN \
            -e GITHUB_REPOSITORY \
            -e GITHUB_EVENT_NAME \
            -e GITHUB_EVENT_PATH \
            -e GITHUB_REF \
            -e GITHUB_SHA \
            -e CI \
            -v "$GITHUB_EVENT_PATH:$GITHUB_EVENT_PATH:ro" \
            ghcr.io/mybono/pr-checkmate:3 all

  # Runs only after a merge lands on main — which, with branch protection on the
  # `checks` job above, only happens once PR CheckMate has already passed. So this
  # never regenerates the changelog for code that failed the gate.
  changelog:
    name: Update Changelog
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate changelog
        run: npm run changelog

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- CHANGELOG.md; then
            echo "No changelog changes."
          else
            git add CHANGELOG.md
            git commit -m "docs(changelog): update CHANGELOG.md [skip ci]"
            git push origin HEAD:main
          fi
