name: Manual Release to npm

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

# Without this, two manual dispatches running close together each bump the
# version locally off the same starting commit and race to push — one wins,
# the other's push is rejected as non-fast-forward. Queueing them (rather than
# cancelling) matters here: unlike a lint job, a half-run release must not be
# thrown away mid-publish.
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Bump Version & Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        id: version
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          npm version "$BUMP_TYPE" --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          git add package.json package-lock.json
          git commit -m "chore(release): $NEW_VERSION"

          # The concurrency group above only serializes against other release
          # runs. The separate PR Gate workflow also pushes to main on its own
          # (the changelog job), so this can still race that push — rebase
          # once immediately before pushing to close that window.
          git pull --rebase origin main
          git push origin HEAD:main

      # The npm CLI bundled with actions/setup-node's Node 20 is too old to
      # speak the granular-token staging protocol; it falls back to a plain
      # PUT that the registry rejects with an opaque 404 instead of staging
      # it for approval. Latest CLI handles it correctly.
      - name: Update npm
        run: npm install -g npm@latest

      # Temporary: the last several runs failed publish with a 404 on an
      # existing, owned package despite the token supposedly having
      # read-write-all-packages + bypass-2FA. This proves what identity and
      # access the secret actually carries in THIS run, instead of guessing
      # from the npmjs.com UI, which may not reflect what's really stored in
      # the GitHub secret. Remove once the real cause is confirmed.
      - name: Debug npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm whoami || echo "whoami failed"
          npm access list packages || echo "access list failed"
          npm access get status gitleaks-secret-scanner-fixed || echo "access get status failed"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Only reached once npm publish above has actually succeeded, so a tag
      # never points at a version that isn't really on the registry.
      - name: Tag release
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          git tag -a "v$NEW_VERSION" -m "chore(release): $NEW_VERSION"
          git push origin "v$NEW_VERSION"

      - name: ✅ Published
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          echo "Successfully published v$NEW_VERSION to npm!"
          echo "https://www.npmjs.com/package/gitleaks-secret-scanner-fixed/v/$NEW_VERSION"
